# Dependency policy checked by `cargo deny check` (cargo-deny 0.20).
# Changing an allow-list here is a trust-boundary change (AGENTS.md).

[graph]
all-features = true

[advisories]
# RustSec advisories affecting a locked dependency fail the check.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. The workspace's own crates are unpublished.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# Duplicate versions are reported, not refused; wildcard requirements are.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
