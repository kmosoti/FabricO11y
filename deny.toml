# Dependency policy checked by `cargo deny check` (cargo-deny 0.20).
# Changing an allow-list here is a trust-boundary change (AGENTS.md).

[graph]
all-features = true

[advisories]
# RustSec advisories affecting a locked dependency fail the check.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses by default; exact MPL exceptions are documented below.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    # See docs/dependency-policy.md for permissions and notice obligations.
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# Exact WebAuthn family only; local source and license bundles are required.
[[licenses.exceptions]]
name = "base64urlsafedata"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "webauthn-attestation-ca"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "webauthn-rs"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "webauthn-rs-core"
version = "=0.5.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "webauthn-rs-proto"
version = "=0.5.5"
allow = ["MPL-2.0"]

[licenses.private]
ignore = true

[bans]
# Duplicate versions are reported, not refused; wildcard requirements are.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
