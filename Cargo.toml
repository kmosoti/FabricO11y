[workspace]
members = [
    "admission-kernel",
    "fabric",
    "fabric-core",
    "fabric-graph",
    "fabric-store",
    "fabric-collect",
    "fabric-query",
    "fabric-mcp",
    "fabric-server",
    "fabric-cli",
    "fabric-client",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
arrow = { version = "=59.2.0", default-features = false, features = ["ipc"] }
chrono = "=0.4.45"
hmac = "=0.12.1"
parking_lot = "=0.12.5"
parquet = { version = "=59.2.0", default-features = false, features = ["arrow", "snap", "zstd"] }
proptest = "=1.11.0"
rusqlite = { version = "=0.41.1", features = ["bundled", "fallible_uint"] }
