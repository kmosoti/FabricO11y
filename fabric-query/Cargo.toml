[package]
name = "fabric-query"
version = "0.2.0-rc.1"
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1"
chrono.workspace = true
fabric = { path = "../fabric" }
fabric-core = { path = "../fabric-core" }
fabric-graph = { path = "../fabric-graph" }
fabric-store = { path = "../fabric-store" }
datafusion = { version = "=55.0.0", default-features = false, features = ["parquet", "sql"] }
arrow.workspace = true
parquet.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12.1"
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
