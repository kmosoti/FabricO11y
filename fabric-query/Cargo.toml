[package]
name = "fabric-query"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fabric = { path = "../fabric" }
datafusion = { version = "=55.0.0", default-features = false, features = ["parquet", "sql"] }
arrow = { version = "=59.2.0", default-features = false }
parquet = { version = "=59.2.0", default-features = false, features = ["arrow", "snap"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12.1"
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
