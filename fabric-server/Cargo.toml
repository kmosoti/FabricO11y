[package]
name = "fabric-server"
version = "0.1.1-alpha.2"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fabric = { path = "../fabric" }
fabric-alert = { path = "../fabric-alert" }
fabric-query = { path = "../fabric-query" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite.workspace = true
sha2 = "0.10"
chrono.workspace = true
hmac.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking"] }
rustix = { version = "1", features = ["event", "fs", "process"] }
admission-kernel = { path = "../admission-kernel" }
parking_lot.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "macros", "signal"] }

[dev-dependencies]
tempfile = "3"
rustix = { version = "1", features = ["net"] }
