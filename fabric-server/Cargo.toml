[package]
name = "fabric-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fabric = { path = "../fabric" }
fabric-query = { path = "../fabric-query" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "fallible_uint"] }
sha2 = "0.10"
chrono = "=0.4.45"
hmac = "=0.12.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking"] }
rustix = { version = "1", features = ["fs", "process"] }
admission-kernel = { path = "../admission-kernel" }
parking_lot = "=0.12.5"

[dev-dependencies]
tempfile = "3"
