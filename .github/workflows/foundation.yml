name: Foundation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora@sha256:d68cae9185777603262e0a7094f792ffed9326b22e1a03e2d2a1731fc3f94733
    steps:
      - uses: actions/checkout@v5
      - name: Install checked toolchain and Jujutsu
        run: sh tools/ci-setup.sh
      - uses: actions/cache@v4
        with:
          path: target
          key: foundation-rust-beta7-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Record execution environment
        run: cat /etc/os-release && uname -a
      - name: Fast checks
        run: /github/home/.cargo/bin/cargo xtask check --tier fast
      - name: Medium checks
        run: /github/home/.cargo/bin/cargo xtask check --tier medium
      - name: Extensive checks
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: /github/home/.cargo/bin/cargo xtask check --tier extensive
