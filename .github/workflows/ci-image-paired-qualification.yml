name: Paired CI image qualification

on:
  pull_request:
    paths:
      - '.github/workflows/ci-image-paired-*.yml'
      - '.github/actions/ci-image-paired-lane/**'
      - '.github/scripts/*ci-image-paired*'
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the live hosted benchmark on a prepared trial branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live && 'paired-ci-image-live' || format('paired-ci-image-simulation-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  simulate:
    if: github.event_name == 'pull_request' || !inputs.run_live
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Simulate paired qualification offline
        run: bash .github/scripts/test-ci-image-paired-simulation.sh "$RUNNER_TEMP"

  plan:
    if: github.repository == 'kmosoti/FabricO11y' && github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.plan.outputs.revision }}
      profile: ${{ steps.plan.outputs.profile }}
      candidate: ${{ steps.plan.outputs.candidate }}
      mode: ${{ steps.plan.outputs.mode }}
      variant: ${{ steps.plan.outputs.variant }}
    steps:
      - name: Require a prepared trial branch for live timing
        run: |
          case "$GITHUB_REF" in
            refs/heads/ci/tool-image-paired-qualification/?*) ;;
            *) printf 'Live benchmarks require ci/tool-image-paired-qualification/<trial>\n' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate trusted source and public image
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci-image-paired-plan.sh

  cold:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(needs.plan.outputs.mode == 'smoke' && '[1]' || '[1,2,3]') }}
    uses: ./.github/workflows/ci-image-paired-trial.yml
    with:
      revision: ${{ needs.plan.outputs.revision }}
      profile: ${{ needs.plan.outputs.profile }}
      candidate: ${{ needs.plan.outputs.candidate }}
      variant: ${{ needs.plan.outputs.variant }}
      smoke: ${{ needs.plan.outputs.mode == 'smoke' }}
      warm: false
      sample: ${{ matrix.sample }}

  warm:
    needs: [plan, cold]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: ${{ fromJSON(needs.plan.outputs.mode == 'smoke' && '[1]' || '[1,2,3]') }}
    uses: ./.github/workflows/ci-image-paired-trial.yml
    with:
      revision: ${{ needs.plan.outputs.revision }}
      profile: ${{ needs.plan.outputs.profile }}
      candidate: ${{ needs.plan.outputs.candidate }}
      variant: ${{ needs.plan.outputs.variant }}
      smoke: ${{ needs.plan.outputs.mode == 'smoke' }}
      warm: true
      sample: ${{ matrix.sample }}

  report:
    needs: [plan, cold, warm]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PROFILE: ${{ needs.plan.outputs.profile }}
      REVISION: ${{ needs.plan.outputs.revision }}
      CANDIDATE: ${{ needs.plan.outputs.candidate }}
      VARIANT: ${{ needs.plan.outputs.variant }}
      MODE: ${{ needs.plan.outputs.mode }}
      COLD_RESULT: ${{ needs.cold.result }}
      WARM_RESULT: ${{ needs.warm.result }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-image-pair-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/paired-ci-evidence
      - name: Verify matched pairs and report the original thresholds
        run: bash .github/scripts/ci-image-paired-report.sh "$RUNNER_TEMP/paired-ci-evidence"
