name: CI image qualification

on:
  push:
    branches: ['ci/tool-image-qualification/**']
    paths:
      - '.github/ci-images/qualification.json'

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'kmosoti/FabricO11y'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.plan.outputs.revision }}
      profile: ${{ steps.plan.outputs.profile }}
      candidate: ${{ steps.plan.outputs.candidate }}
      samples: ${{ steps.plan.outputs.samples }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate the source revision and public image
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: /var/tmp
        run: |
          set -euo pipefail
          plan=.github/ci-images/qualification.json
          revision=$(jq -er '.revision | select(test("^[0-9a-f]{40}$"))' "$plan")
          profile=$(jq -er '.profile | select(. == "verify" or . == "native-acceptance")' "$plan")
          candidate=$(jq -er '.candidate | select(test("^ghcr[.]io/kmosoti/fabrico11y-ci@sha256:[0-9a-f]{64}$"))' "$plan")
          samples=$(jq -er 'if has("samples") then .samples else 1 end | select(. == 1 or . == 3)' "$plan")
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/develop...$revision" --jq .status)
          case "$status" in identical|behind) ;; *) echo "Revision is outside develop history" >&2; exit 1 ;; esac

          # The source revision must have the measured development workflow and cache contract.
          for path in .github/workflows/development-checks.yml \
              .github/actions/restore-ci-cache/action.yml .github/actions/save-ci-cache/action.yml; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/$path?ref=$revision" | cmp - "$path"
          done

          # Inspect the public manifest and config without a registry login or a layer pull.
          DOCKER_CONFIG=$(mktemp -d "$TMPDIR/fabric-qualification-docker.XXXXXXXX")
          export DOCKER_CONFIG
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          df -P "$docker_root" "$GITHUB_WORKSPACE"
          docker system df
          config=$(docker buildx imagetools inspect "$candidate" --format '{{json .Image}}')
          jq -e --arg revision "$revision" '
            .architecture == "amd64" and .os == "linux" and
            .config.Labels["org.opencontainers.image.source"] == "https://github.com/kmosoti/FabricO11y" and
            .config.Labels["org.opencontainers.image.revision"] == $revision
          ' <<< "$config"
          compressed_bytes=$(docker buildx imagetools inspect "$candidate" --raw |
            jq -er '.layers | map(.size) | add | select(. > 0)')
          {
            printf 'revision=%s\nprofile=%s\ncandidate=%s\nsamples=%s\n' "$revision" "$profile" "$candidate" "$samples"
          } >> "$GITHUB_OUTPUT"
          {
            printf '## CI image qualification\n\n'
            printf -- '- Check profile: `%s`\n- Product revision: `%s`\n' "$profile" "$revision"
            printf -- '- Candidate: `%s` (%s compressed layer bytes)\n' "$candidate" "$compressed_bytes"
            printf -- '- Samples per variant and cache state: `%s`\n' "$samples"
          } >> "$GITHUB_STEP_SUMMARY"

  baseline-cold:
    needs: plan
    uses: ./.github/workflows/ci-image-trial.yml
    with:
      revision: ${{ needs.plan.outputs.revision }}
      profile: ${{ needs.plan.outputs.profile }}
      image: registry.fedoraproject.org/fedora@sha256:d68cae9185777603262e0a7094f792ffed9326b22e1a03e2d2a1731fc3f94733
      prebuilt: false
      warm: false
      prime: true
      sample: 1

  candidate-cold:
    needs: plan
    uses: ./.github/workflows/ci-image-trial.yml
    with:
      revision: ${{ needs.plan.outputs.revision }}
      profile: ${{ needs.plan.outputs.profile }}
      image: ${{ needs.plan.outputs.candidate }}
      prebuilt: true
      warm: false
      prime: true
      sample: 1

  cold-controls:
    needs: plan
    if: needs.plan.outputs.samples == '3'
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
        sample: [2, 3]
    uses: ./.github/workflows/ci-image-trial.yml
    with:
      revision: ${{ needs.plan.outputs.revision }}
      profile: ${{ needs.plan.outputs.profile }}
      image: ${{ matrix.variant == 'candidate' && needs.plan.outputs.candidate || 'registry.fedoraproject.org/fedora@sha256:d68cae9185777603262e0a7094f792ffed9326b22e1a03e2d2a1731fc3f94733' }}
      prebuilt: ${{ matrix.variant == 'candidate' }}
      warm: false
      prime: false
      sample: ${{ matrix.sample }}

  baseline-warm:
    needs: [plan, baseline-cold]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: ${{ fromJSON(needs.plan.outputs.samples == '3' && '[1,2,3]' || '[1]') }}
    uses: ./.github/workflows/ci-image-trial.yml
    with:
      revision: ${{ needs.plan.outputs.revision }}
      profile: ${{ needs.plan.outputs.profile }}
      image: registry.fedoraproject.org/fedora@sha256:d68cae9185777603262e0a7094f792ffed9326b22e1a03e2d2a1731fc3f94733
      prebuilt: false
      warm: true
      prime: false
      sample: ${{ matrix.sample }}

  candidate-warm:
    needs: [plan, candidate-cold]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: ${{ fromJSON(needs.plan.outputs.samples == '3' && '[1,2,3]' || '[1]') }}
    uses: ./.github/workflows/ci-image-trial.yml
    with:
      revision: ${{ needs.plan.outputs.revision }}
      profile: ${{ needs.plan.outputs.profile }}
      image: ${{ needs.plan.outputs.candidate }}
      prebuilt: true
      warm: true
      prime: false
      sample: ${{ matrix.sample }}

  check-environments:
    needs: [plan, baseline-cold, candidate-cold, cold-controls, baseline-warm, candidate-warm]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SAMPLES: ${{ needs.plan.outputs.samples }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-image-trial-${{ github.run_attempt }}-*-environment
          path: ${{ runner.temp }}/ci-image-trial-environments
      - name: Compare every compiler, prerequisite and runner kernel identity
        run: |
          set -euo pipefail
          fingerprint_root="$RUNNER_TEMP/ci-image-trial-environments"
          expected=''
          for variant in baseline candidate; do
            for state in cold warm; do
              for ((sample=1; sample <= SAMPLES; sample++)); do
                name="$variant-$state-$sample"
                path="$fingerprint_root/ci-image-trial-$GITHUB_RUN_ATTEMPT-$name-environment/environment.sha256"
                if [[ ! -f "$path" ]]; then
                  printf 'No environment fingerprint for %s\n' "$name" >&2
                  exit 1
                fi
                fingerprint=$(<"$path")
                [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
                printf '%s %s\n' "$name" "$fingerprint"
                expected=${expected:-$fingerprint}
                if [[ "$fingerprint" != "$expected" ]]; then
                  printf 'Environment differs from baseline-cold-1 for %s\n' "$name" >&2
                  exit 1
                fi
              done
            done
          done
