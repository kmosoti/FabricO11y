name: CI image trial

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      profile:
        required: true
        type: string
      image:
        required: true
        type: string
      prebuilt:
        required: true
        type: boolean
      warm:
        required: true
        type: boolean
    outputs:
      environment:
        description: Digest of the runner kernel, compilers and native libraries
        value: ${{ jobs.hosted.outputs.environment }}

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  LEAN_NUM_THREADS: '4'
  TMPDIR: /var/tmp
  FABRIC_FUZZ_TARGET_DIR: /github/home/.cache/fabrico11y-fuzz-target

jobs:
  hosted:
    if: github.repository == 'kmosoti/FabricO11y' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/tool-image-qualification/')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.profile == 'verify' && 45 || 300 }}
    container:
      image: ${{ inputs.image }}
    outputs:
      environment: ${{ steps.environment.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Identify the workspace and trial cache
        id: trial
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          TRIAL_IMAGE: ${{ inputs.image }}
          PROFILE: ${{ inputs.profile }}
          RUNNER_ARCH: ${{ runner.arch }}
          PREBUILT: ${{ inputs.prebuilt }}
          WARM: ${{ inputs.warm }}
          BUILD_INPUTS: ${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.lock', 'fuzz/Cargo.lock', '.github/scripts/*.sh', 'verification/aeneas.opam.lock') }}
        run: |
          set -eu
          test "$RUNNER_ARCH" = "X64"
          # The base Fedora image has no Git yet, so checkout uses the pinned REST archive there.
          if [ "$PREBUILT" = true ]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          fi
          key="ci-image-trial-v1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PROFILE-$RUNNER_ARCH-${TRIAL_IMAGE##*@sha256:}-$BUILD_INPUTS"
          {
            printf 'key=%s\n' "$key"
            printf 'application_paths<<PATHS\n'
            printf '%s\n' /github/home/.cargo/registry /github/home/.cargo/git/db target
            if [ "$PROFILE" = native-acceptance ] || [ "$PREBUILT" = false ]; then
              printf '%s\n' /github/home/.cache/fabrico11y-fuzz-target
            fi
            if [ "$PREBUILT" = false ]; then
              printf '%s\n' /github/home/.local/share/fabrico11y/schema-tools /github/home/.local/share/fabrico11y/engine-tools
            fi
            printf 'PATHS\n'
          } >> "$GITHUB_OUTPUT"
          {
            printf '## Hosted sample\n\n'
            printf -- '- Profile: `%s`\n- Product revision: `%s`\n- Image: `%s`\n- Warm cache: `%s`\n- Cache key: `%s`\n' \
              "$PROFILE" "$EXPECTED_REVISION" "$TRIAL_IMAGE" "$WARM" "$key"
          } >> "$GITHUB_STEP_SUMMARY"
          cat /etc/os-release
          uname -a
          df -P / "$GITHUB_WORKSPACE"

      - name: Restore exact application cache
        id: application-cache
        if: inputs.warm
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.trial.outputs.application_paths }}
          key: ${{ steps.trial.outputs.key }}
          fail-on-cache-miss: true

      - name: Install baseline Cargo and Jujutsu
        if: ${{ !inputs.prebuilt }}
        run: sh .github/scripts/install-toolchain.sh

      - name: Restore exact baseline proof tool cache
        id: proof-cache
        if: inputs.warm && !inputs.prebuilt && inputs.profile == 'native-acceptance'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /github/home/.local/share/fabrico11y/proof-tools
          key: ${{ steps.trial.outputs.key }}-proof
          fail-on-cache-miss: true

      - name: Require exact warm cache hits
        if: inputs.warm
        env:
          APPLICATION_HIT: ${{ steps.application-cache.outputs.cache-hit }}
          PROOF_HIT: ${{ steps.proof-cache.outputs.cache-hit }}
          BASELINE_NATIVE: ${{ !inputs.prebuilt && inputs.profile == 'native-acceptance' }}
        run: |
          set -eu
          test "$APPLICATION_HIT" = true
          if [ "$BASELINE_NATIVE" = true ]; then
            test "$PROOF_HIT" = true
          fi

      - name: Install baseline native verification tools
        if: ${{ !inputs.prebuilt && inputs.profile == 'native-acceptance' }}
        run: sh .github/scripts/install-verification-tools.sh

      - name: Install baseline schema checker
        if: ${{ !inputs.prebuilt && inputs.profile == 'verify' }}
        run: sh .github/scripts/install-schema-tools.sh

      - name: Check prebuilt tool identities
        if: inputs.prebuilt
        run: sh .github/scripts/check-ci-image-tools.sh ${{ inputs.profile == 'verify' && 'common' || 'native' }}

      - name: Record compiler identity and disk headroom
        id: environment
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -eu
          kernel=$(uname -r)
          compiler=$(rustc -vV)
          cargo=$(cargo -V)
          packages=$(rpm -q gcc glibc openssl-devel)
          if [ "$PROFILE" = native-acceptance ]; then
            verus_compiler=$(rustup run 1.99.1 rustc -vV)
            extraction_compiler=$(rustup run nightly-2026-09-17 rustc -vV)
            compiler=$(printf '%s\n' "$compiler" "$verus_compiler" "$extraction_compiler")
            cxx_package=$(rpm -q gcc-c++)
            packages=$(printf '%s\n' "$packages" "$cxx_package")
          fi
          identity=$(printf '%s\n' "$kernel" "$compiler" "$cargo" "$packages")
          printf '%s\n' "$identity"
          digest=$(printf '%s\n' "$identity" | sha256sum)
          printf 'digest=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
          df -P / "$GITHUB_WORKSPACE"

      - name: Initialize candidate workspace
        if: inputs.profile == 'native-acceptance'
        run: jj git init --colocate

      - name: Native architecture, coverage, proofs and fuzz regressions
        if: inputs.profile == 'native-acceptance'
        run: cargo xtask check --group native

      - name: Native engine custody and recovery regressions
        if: inputs.profile == 'native-acceptance'
        timeout-minutes: 10
        run: sh .github/scripts/check-engine.sh

      - name: Fuzz smoke campaigns
        if: inputs.profile == 'native-acceptance'
        env:
          FABRIC_FUZZ_SMOKE_SECONDS: '60'
        run: cargo xtask fuzz smoke /var/tmp/fabric-fuzz-smoke

      - name: Shared workspace checks
        if: inputs.profile == 'verify'
        run: cargo xtask check --group workspace

      - name: Build release collection executables
        if: inputs.profile == 'verify'
        run: cargo build --locked --release --workspace --bins --examples

      - name: Release SDK and Spindle restart smoke
        if: inputs.profile == 'verify'
        timeout-minutes: 2
        run: target/release/xtask collection smoke

      - name: Save baseline proof tool cache for the warm trial
        if: ${{ !inputs.warm && !inputs.prebuilt && inputs.profile == 'native-acceptance' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /github/home/.local/share/fabrico11y/proof-tools
          key: ${{ steps.trial.outputs.key }}-proof

      - name: Save application cache for the warm trial
        if: ${{ !inputs.warm }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.trial.outputs.application_paths }}
          key: ${{ steps.trial.outputs.key }}

      - name: Record final disk headroom
        if: always()
        run: df -P / "$GITHUB_WORKSPACE"
