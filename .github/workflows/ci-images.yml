name: CI tool images

on:
  push:
    branches: [main]
    paths:
      - '.github/ci-images/Containerfile'
      - '.github/scripts/check-ci-image-tools.sh'
      - '.github/scripts/install-*-tools.sh'
      - '.github/scripts/install-toolchain.sh'
      - '.github/workflows/ci-images.yml'
      - 'rust-toolchain.toml'
      - 'verification/aeneas.opam.lock'
  workflow_dispatch:
    inputs:
      variant:
        description: Image set to build, verify, and publish from main
        type: choice
        options: [standard, common-seeded, all]
        default: standard

permissions:
  contents: read

concurrency:
  group: ci-tool-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'kmosoti/FabricO11y' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kmosoti/fabrico11y-ci
      PUBLISH_VARIANT: ${{ github.event_name == 'push' && 'standard' || inputs.variant }}
      TMPDIR: /var/tmp
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the trusted source context
        id: context
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          case "$PUBLISH_VARIANT" in standard|common-seeded|all) ;; *) exit 1 ;; esac
          context=$(mktemp -d "$RUNNER_TEMP/fabrico11y-ci-images.XXXXXXXX")
          printf 'root=%s\n' "$context" >> "$GITHUB_OUTPUT"
          paths=()
          if [[ "$PUBLISH_VARIANT" == standard ]]; then
            paths=(.github/ci-images/Containerfile
              .github/scripts/check-ci-image-tools.sh
              .github/scripts/install-engine-tools.sh
              .github/scripts/install-schema-tools.sh
              .github/scripts/install-toolchain.sh
              .github/scripts/install-verification-tools.sh
              rust-toolchain.toml verification/aeneas.opam.lock)
          fi
          git archive "$GITHUB_SHA" -- "${paths[@]}" | tar -x -C "$context"
      - name: Build common and native tool images
        if: env.PUBLISH_VARIANT != 'common-seeded'
        env:
          CONTEXT: ${{ steps.context.outputs.root }}
        run: |
          set -euo pipefail
          for target in common native; do
            docker buildx build --platform linux/amd64 --load --target "$target" \
              --file "$CONTEXT/.github/ci-images/Containerfile" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$IMAGE:$target-$GITHUB_SHA" "$CONTEXT"
          done
      - name: Verify the installed tools offline
        if: env.PUBLISH_VARIANT != 'common-seeded'
        run: |
          set -euo pipefail
          for target in common native; do
            docker run --rm --network none --env HOME=/github/home "$IMAGE:$target-$GITHUB_SHA" \
              sh /opt/fabrico11y/bootstrap/.github/scripts/check-ci-image-tools.sh "$target"
          done
      - name: Publish verified images and record their digests
        if: env.PUBLISH_VARIANT != 'common-seeded'
        env:
          GHCR_TOKEN: ${{ github.token }}
          TARGETS: common native
        run: &publish-verified-images |
          set -euo pipefail
          docker_config=$(mktemp -d "$RUNNER_TEMP/fabrico11y-docker-config.XXXXXXXX")
          export DOCKER_CONFIG="$docker_config"
          trap 'rm -rf -- "$docker_config"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          read -ra targets <<< "$TARGETS"
          {
            if [[ "$TARGETS" == 'common native' || "$PUBLISH_VARIANT" == common-seeded ]]; then
              printf '## FabricO11y CI tool images\n\nSource commit `%s`\n\n' "$GITHUB_SHA"
            fi
            for target in "${targets[@]}"; do
              tagged="$IMAGE:$target-$GITHUB_SHA"
              docker push "$tagged" >&2
              digest=$(docker image inspect "$tagged" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -E "^$IMAGE@sha256:[0-9a-f]{64}$")
              size=$(docker image inspect "$tagged" --format '{{.Size}}')
              printf -- '- %s: `%s` (%s uncompressed bytes)\n' "$target" "$digest" "$size"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the common image with a release compiler seed
        if: env.PUBLISH_VARIANT != 'standard'
        env:
          CONTEXT: ${{ steps.context.outputs.root }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load --target common-seeded \
            --file "$CONTEXT/.github/ci-images/Containerfile" \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.fabrico11y.ci.variant=common-seeded" \
            --tag "$IMAGE:common-seeded-$GITHUB_SHA" "$CONTEXT"
      - name: Verify the seeded release preflight offline
        if: env.PUBLISH_VARIANT != 'standard'
        env:
          CONTEXT: ${{ steps.context.outputs.root }}
        run: |
          set -euo pipefail
          workspace=/__w/FabricO11y/FabricO11y
          probe="$RUNNER_TEMP/seeded-image-preflight.log"
          docker run --rm --network none \
            --mount "type=bind,src=$CONTEXT,dst=$workspace,readonly" --workdir "$workspace" \
            --env HOME=/github/home --env CARGO_BUILD_JOBS=4 --env CARGO_INCREMENTAL=0 \
            --env CARGO_PROFILE_DEV_DEBUG=0 --env CARGO_PROFILE_TEST_DEBUG=0 \
            "$IMAGE:common-seeded-$GITHUB_SHA" \
            sh -ec '
              bash .github/scripts/ci-image-paired-seed.sh revision \
                /opt/fabrico11y/compiler-seed/provenance/revision "$1"
              sh /opt/fabrico11y/bootstrap/.github/scripts/check-ci-image-tools.sh common
              exec /opt/fabrico11y/compiler-seed/release-build --preflight
            ' preflight "$GITHUB_SHA" | tee "$probe"
          grep -Fxq 'compiler-seed ready' "$probe"
      - name: Publish the verified common compiler-seed image
        if: env.PUBLISH_VARIANT != 'standard'
        env:
          GHCR_TOKEN: ${{ github.token }}
          TARGETS: common-seeded
        run: *publish-verified-images
      - name: Clean up the source context
        if: always() && steps.context.outputs.root != ''
        env:
          CONTEXT: ${{ steps.context.outputs.root }}
        run: rm -rf -- "$CONTEXT"
