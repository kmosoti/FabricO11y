name: Development checks
on:
  pull_request:
    branches: [main, develop, 'stack/**']
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [develop]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  LEAN_NUM_THREADS: '4'
  RUSTUP_AUTO_INSTALL: '0'
  TMPDIR: /var/tmp
  FABRIC_FUZZ_TARGET_DIR: /github/home/.cache/fabrico11y-fuzz-target
concurrency:
  group: development-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: &native-ci-image ghcr.io/kmosoti/fabrico11y-ci@sha256:2a609c7c15f4ad58498abd29c0bcb4671fad8d805fb3f8cc0200875c01a1229f
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Trust the checked-out workspace for job Git commands
        run: &trust-ci-workspace |
          set -eu
          config=$(mktemp "$RUNNER_TEMP/fabric-gitconfig.XXXXXXXX")
          git config --file "$config" --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$(GIT_CONFIG_GLOBAL="$config" git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            printf 'Checkout does not match the tested source revision.\n' >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            parents_of() {
              GIT_CONFIG_GLOBAL="$config" git cat-file commit "$1" | sed -n '1,/^$/s/^parent //p'
            }
            reject_merge() {
              printf 'The tested merge does not match the event base and head.\n' >&2
              exit 1
            }
            parents=$(parents_of HEAD)
            expected_base="$PR_BASE_SHA"
            case "$PR_BASE_REF" in
              stack/*)
                synthetic_base=$(printf '%s\n' "$parents" | sed -n '1p')
                if [ "$synthetic_base" != "$expected_base" ]; then
                  # GitHub stacks use the predecessor PR's synthetic merge as the first parent.
                  predecessor_parents=$(parents_of "$synthetic_base")
                  predecessor_base=$(printf '%s\n' "$predecessor_parents" | sed -n '1p')
                  [ -n "$predecessor_base" ] &&
                    [ "$predecessor_parents" = "$(printf '%s\n%s' "$predecessor_base" "$PR_BASE_SHA")" ] ||
                    reject_merge
                  expected_base="$synthetic_base"
                fi
                ;;
            esac
            [ "$parents" = "$(printf '%s\n%s' "$expected_base" "$PR_HEAD_SHA")" ] || reject_merge
          fi
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Check installed native verification tools and source pins
        env:
          CI_IMAGE_FLAVOR: native
        run: &ci-image-preflight |
          set -eu
          bootstrap=/opt/fabrico11y/bootstrap
          set -- rust-toolchain.toml .github/scripts/install-toolchain.sh \
            .github/scripts/install-schema-tools.sh .github/scripts/check-ci-image-tools.sh
          if [ "$CI_IMAGE_FLAVOR" = native ]; then
            set -- "$@" verification/aeneas.opam.lock .github/scripts/install-verification-tools.sh \
              .github/scripts/install-engine-tools.sh
          fi
          reject_image_input() {
            printf 'CI image input is missing or differs from the checkout: %s\n' "$1" >&2
            printf 'Use the Fedora bootstrap workflow to review changes to CI tool inputs. See docs/ci-images.md.\n' >&2
            exit 1
          }
          require_image_input() {
            if [ ! -f "$1" ] || [ ! -f "$2" ] ||
               ! checkout_hash=$(sha256sum < "$1") ||
               ! image_hash=$(sha256sum < "$2") ||
               [ "$checkout_hash" != "$image_hash" ]; then
              reject_image_input "$1"
            fi
          }
          for path do
            require_image_input "$path" "$bootstrap/$path"
          done
          if [ "$CI_IMAGE_FLAVOR" = common ]; then
            seed=/opt/fabrico11y/compiler-seed
            bash .github/scripts/ci-image-paired-seed.sh revision "$seed/provenance/revision" "$CI_IMAGE_SEED_REVISION"
            if ! (cd "$seed" &&
                  test -x release-build && test -x registry-rustc && test -x sccache &&
                  sha256sum --check --strict --status provenance/tools.sha256); then
              printf 'CI compiler seed image has missing or invalid baked tools.\n' >&2
              exit 1
            fi
          fi
          product_rust=$(sed -En 's/^channel = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' rust-toolchain.toml)
          if [ -z "$product_rust" ]; then
            printf 'rust-toolchain.toml must pin an exact numeric Rust version.\n' >&2
            exit 1
          fi
          actual_rust=$(rustc --version)
          case "$actual_rust" in
            "rustc $product_rust "*) printf '%s\n' "$actual_rust" ;;
            *) printf 'Expected checkout Rust %s, got %s\n' "$product_rust" "$actual_rust" >&2; exit 1 ;;
          esac
          sh "$bootstrap/.github/scripts/check-ci-image-tools.sh" "$CI_IMAGE_FLAVOR"
      - uses: ./.github/actions/restore-ci-cache
        id: ci-sources
        with:
          profile: native-acceptance
          image: *native-ci-image
          layer: sources
      - uses: ./.github/actions/restore-ci-cache
        id: ci-cache
        with:
          profile: native-acceptance
          image: *native-ci-image
          layer: compiled
      - name: Initialize candidate workspace
        run: jj git init --colocate
      - name: Native architecture, coverage, proofs and fuzz regressions
        run: cargo xtask check --group native
      - name: Native engine custody and recovery regressions
        timeout-minutes: 10
        run: sh .github/scripts/check-engine.sh
      - name: Fuzz smoke campaigns
        if: github.event_name != 'schedule'
        env:
          FABRIC_FUZZ_SMOKE_SECONDS: ${{ github.event_name == 'pull_request' && '15' || '60' }}
        run: cargo xtask fuzz smoke /var/tmp/fabric-fuzz-smoke
      - name: Scheduled fuzz campaigns
        if: github.event_name == 'schedule'
        run: cargo xtask fuzz scheduled /var/tmp/fabric-fuzz-scheduled
      - name: Save trusted CI cache
        uses: ./.github/actions/save-ci-cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          sources-key: ${{ steps.ci-sources.outputs.sources-key }}
          sources-hit: ${{ steps.ci-sources.outputs.sources-hit }}
          key: ${{ steps.ci-cache.outputs.key }}
          hit: ${{ steps.ci-cache.outputs.hit }}
          fuzz-key: ${{ steps.ci-cache.outputs.fuzz-key }}
          fuzz-hit: ${{ steps.ci-cache.outputs.fuzz-hit }}
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: &common-seeded-ci-image ghcr.io/kmosoti/fabrico11y-ci@sha256:65f2ea4b0e1fa702259853d9d4f9db2b44274e3cda50beb747743de614a9ca4e
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Trust the checked-out workspace for job Git commands
        run: *trust-ci-workspace
      - name: Check installed workspace tools and source pins
        env:
          CI_IMAGE_FLAVOR: common
          CI_IMAGE_SEED_REVISION: b8f1cddd9831a1b12c41bc58c3287f95823e094d
        run: *ci-image-preflight
      - uses: ./.github/actions/restore-ci-cache
        id: ci-sources
        with:
          profile: verify
          image: *common-seeded-ci-image
          layer: sources
      - uses: ./.github/actions/restore-ci-cache
        id: ci-cache
        with:
          profile: verify
          image: *common-seeded-ci-image
          layer: compiled
      - name: Record execution environment
        run: cat /etc/os-release && uname -a
      - name: Shared workspace checks
        run: cargo xtask check --group workspace
      - name: Build release collection executables
        env:
          # Derive both policy checksums from the source commit that published the qualified digest.
          CI_IMAGE_SEED_BUILDER_SHA256: 3740bd49e3fda0c564402f8884521d6e7e485529852575bc4f2695e4f96bb357
          CI_IMAGE_SEED_PACKAGES_SHA256: c365622238c27c049293ec1cf7e1b56bab47d7b184156edc42ff706bf085028b
        run: |
          set -eu
          seed=/opt/fabrico11y/compiler-seed
          launcher_hash=$(sha256sum < "$seed/release-build")
          wrapper_hash=$(sha256sum < "$seed/registry-rustc")
          seed_policy_matches() {
            if printf '%s  %s\n' "$2" "$1" | sha256sum --check --strict --status; then
              return 0
            fi
            printf 'Compiler seed disabled: checkout policy differs at %s. Building with Cargo.\n' "$1" >&2
            return 1
          }
          if seed_policy_matches .github/ci-images/compiler-seed-release.sh "${launcher_hash%% *}" &&
             seed_policy_matches .github/ci-images/compiler-seed-registry-rustc.sh "${wrapper_hash%% *}" &&
             seed_policy_matches .github/ci-images/compiler-seed-build.sh "$CI_IMAGE_SEED_BUILDER_SHA256" &&
             seed_policy_matches .github/ci-images/compiler-seed-packages.py "$CI_IMAGE_SEED_PACKAGES_SHA256"; then
            exec "$seed/release-build"
          fi
          exec cargo build --locked --release --workspace --bins --examples
      - name: Release SDK and Spindle restart smoke
        timeout-minutes: 2
        run: target/release/xtask collection smoke
      - name: Extended workflow tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo xtask check --group workflow
      - name: Save trusted CI cache
        uses: ./.github/actions/save-ci-cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          sources-key: ${{ steps.ci-sources.outputs.sources-key }}
          sources-hit: ${{ steps.ci-sources.outputs.sources-hit }}
          key: ${{ steps.ci-cache.outputs.key }}
          hit: ${{ steps.ci-cache.outputs.hit }}
          fuzz-key: ${{ steps.ci-cache.outputs.fuzz-key }}
          fuzz-hit: ${{ steps.ci-cache.outputs.fuzz-hit }}
