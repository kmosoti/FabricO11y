name: Development checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: development-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-acceptance:
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora@sha256:d68cae9185777603262e0a7094f792ffed9326b22e1a03e2d2a1731fc3f94733
    steps:
      - uses: actions/checkout@v5
      - name: Install Cargo and Jujutsu
        run: sh .github/scripts/install-toolchain.sh
      - name: Restore pinned verification tool installation
        uses: actions/cache@v4
        with:
          path: /github/home/.local/share/fabrico11y/proof-tools
          key: native-fedora44-d68cae91-${{ runner.arch }}-${{ hashFiles('.github/workflows/development-checks.yml', '.github/scripts/install-verification-tools.sh', '.github/scripts/install-toolchain.sh', 'verification/aeneas.opam.lock', 'rust-toolchain.toml') }}
      - name: Install pinned native verification tools
        run: sh .github/scripts/install-verification-tools.sh
      - name: Initialize candidate workspace
        run: jj git init --colocate
      - name: Architecture, tests, proofs and fuzz regressions
        run: /github/home/.cargo/bin/cargo xtask check --tier acceptance
      - name: Fuzz smoke campaigns
        if: github.event_name != 'schedule'
        run: /github/home/.cargo/bin/cargo xtask fuzz smoke /tmp/fabric-fuzz-smoke
      - name: Scheduled fuzz campaigns
        if: github.event_name == 'schedule'
        run: /github/home/.cargo/bin/cargo xtask fuzz scheduled /tmp/fabric-fuzz-scheduled
  verify:
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora@sha256:d68cae9185777603262e0a7094f792ffed9326b22e1a03e2d2a1731fc3f94733
    steps:
      - uses: actions/checkout@v5
      - name: Install checked toolchain and Jujutsu
        run: sh .github/scripts/install-toolchain.sh
      - name: Initialize Jujutsu workspace
        run: jj git init --colocate
      - uses: actions/cache@v4
        with:
          path: target
          key: rust-beta7-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Record execution environment
        run: cat /etc/os-release && uname -a
      - name: Medium checks
        run: /github/home/.cargo/bin/cargo xtask check --tier medium
      - name: Extensive checks
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: /github/home/.cargo/bin/cargo xtask check --tier extensive
