name: Main Branch Human Gate

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-release-gate
  cancel-in-progress: true

jobs:
  main-human-approval:
    name: main-human-approval
    runs-on: ubuntu-latest
    environment: main-release
    steps:
      - name: Verify human release approval for develop promotion
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/develop" ]; then
            echo "::error::Only refs/heads/develop may deploy to main-release, got $RELEASE_REF"
            exit 1
          fi
          echo "Human reviewer approved promotion of develop ($RELEASE_HEAD_SHA) into main."
