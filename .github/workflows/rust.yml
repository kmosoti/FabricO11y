name: Rust

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check locked application tests
        run: cargo test --locked --workspace --all-features
      - name: Check alpha runner negative controls
        run: python3 -B tools/alpha/test_runner.py
      - name: Check alpha seeded workload and rate oracle
        run: python3 -B tools/alpha/test_workload.py
      - name: Check the delivery oracle and its mutation controls
        run: python3 -B tools/alpha/test_delivery_oracle.py
