name: Measure one pinned CI image lane
description: Run the original workload in a fresh container and restore only its exact trial cache
inputs:
  role:
    required: true
    description: Baseline or candidate
  archive-path:
    required: true
    description: Host PATH including the lane's cache archive shim
outputs:
  key:
    description: Exact cache key prefix
    value: ${{ steps.setup.outputs.key }}
  application-paths:
    description: Role-specific application cache paths
    value: ${{ steps.setup.outputs.application_paths }}
  proof-path:
    description: Role-specific baseline proof cache path
    value: ${{ steps.setup.outputs.proof_path }}
runs:
  using: composite
  steps:
    - name: Start a private daemon and pull the pinned image
      id: setup
      shell: bash
      env:
        PAIR_ROLE: ${{ inputs.role }}
      run: bash .github/scripts/ci-image-paired-lane.sh start

    - name: Materialize the same pinned source archive for this role
      shell: bash
      env:
        PAIR_ROLE: ${{ inputs.role }}
      run: bash .github/scripts/ci-image-paired-lane.sh source

    - name: Restore exact application cache
      id: application
      if: env.PAIR_WARM == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      env:
        PATH: ${{ inputs.archive-path }}
        PAIR_CACHE_ROLE: ${{ inputs.role }}
      with:
        path: ${{ steps.setup.outputs.application_paths }}
        key: ${{ steps.setup.outputs.key }}-application
        fail-on-cache-miss: true

    - name: Install baseline Cargo and Jujutsu
      shell: bash
      env:
        PAIR_ROLE: ${{ inputs.role }}
        APPLICATION_HIT: ${{ steps.application.outputs.cache-hit }}
      run: bash .github/scripts/ci-image-paired-lane.sh toolchain

    - name: Restore exact baseline proof cache
      id: proof
      if: env.PAIR_WARM == 'true' && env.PAIR_PROFILE == 'native-acceptance' && inputs.role == 'baseline'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      env:
        PATH: ${{ inputs.archive-path }}
        PAIR_CACHE_ROLE: baseline
      with:
        path: ${{ steps.setup.outputs.proof_path }}
        key: ${{ steps.setup.outputs.key }}-proof
        fail-on-cache-miss: true

    - name: Check or install tool identities and run verification
      shell: bash
      env:
        PAIR_ROLE: ${{ inputs.role }}
        PROOF_HIT: ${{ steps.proof.outputs.cache-hit }}
      run: bash .github/scripts/ci-image-paired-lane.sh verify

    - name: Reclaim this lane's private daemon and layers
      if: always()
      shell: bash
      env:
        PAIR_ROLE: ${{ inputs.role }}
      run: bash .github/scripts/ci-image-paired-lane.sh cleanup
