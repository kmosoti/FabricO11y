[package]
name = "xtask"
default-run = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
toml = "1"
proc-macro2 = "1"
arrow-array = "=59.3.2"
arrow-schema = "=59.3.2"
arrow-ipc = { version = "=59.3.2", default-features = false }

fabric = { path = "../fabric" }
fabric-core = { path = "../fabric-core" }
fabric-server = { path = "../fabric-server" }
rusqlite.workspace = true
rustix = { version = "1", features = ["time", "process"] }

[features]
allocation-metrics = []
deployment-qualification = []

[[test]]
name = "deployment_profiles"
required-features = ["deployment-qualification"]
