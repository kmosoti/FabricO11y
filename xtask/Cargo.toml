[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "Repository checks: architecture layers, core purity, check registry"
publish = false
license = "Apache-2.0"

[features]
verification-sha-openssl = ["dep:openssl"]

[dependencies]
libc = "=0.2.189"
serde = "=1.0.228"
serde_json = "=1.0.150"
sha2 = "=0.10.9"
openssl = { version = "=0.10.81", optional = true }
