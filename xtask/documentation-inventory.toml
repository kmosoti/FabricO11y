schema_version = 1

[classifications]
operational-directives = "Repository operating rules; preserve as actionable semantic instructions."
knowledge-record = "Dated decision, observation, or research body with structured metadata in the sidecar."
knowledge-index-and-guidance = "Reader guidance and stable index for the knowledge graph."
published-release-artifact = "Published release history; retain as immutable evidence."
proof-or-verification-evidence = "Proof scope, contracts, or verification evidence; retain factual detail."
maintained-prose = "Current product, setup, contribution, or package documentation."


