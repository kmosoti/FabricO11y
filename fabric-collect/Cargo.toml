[package]
name = "fabric-collect"
version = "0.2.0-rc.1"
edition.workspace = true
license.workspace = true

[dependencies]
admission-kernel = { path = "../admission-kernel" }
chrono.workspace = true
fabric-core = { path = "../fabric-core" }
fabric-graph = { path = "../fabric-graph" }
fabric-store = { path = "../fabric-store" }
parking_lot.workspace = true
rustix = { version = "1", features = ["fs", "process"] }
fabric = { path = "../fabric" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }

[dev-dependencies]
fabric-query = { path = "../fabric-query" }
fabric-server = { path = "../fabric-server" }
tempfile = "3"
