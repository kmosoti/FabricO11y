[package]
name = "fabric-mcp"
version = "0.1.1-alpha.2"
edition.workspace = true
license.workspace = true

[features]
local-http = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "tokio/net", "tokio/time", "tokio-util/rt"]

[dependencies]
fabric = { path = "../fabric", features = ["query-schema"] }
fabric-client = { path = "../fabric-client" }
rmcp = { version = "=3.5.1", features = ["server", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "io-std"] }

hyper = { version = "1.12.0", optional = true, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", optional = true, features = ["tokio"] }
http-body-util = { version = "0.1.5", optional = true }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tempfile = "3"
