[package]
name = "fabric-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
arrow = { version = "=59.2.0", default-features = false, features = ["ipc"] }
chrono = "=0.4.45"
fabric-core = { path = "../fabric-core" }
fabric-graph = { path = "../fabric-graph" }
parking_lot = "=0.12.5"
parquet = { version = "=59.2.0", default-features = false, features = ["arrow", "snap", "zstd"] }
redb = "=3.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
