[package]
name = "fabric-cli"
version = "0.2.0-rc.1"
edition.workspace = true
license.workspace = true

[[bin]]
name = "fabric"
path = "src/main.rs"

[dependencies]
admission-kernel = { path = "../admission-kernel" }
arrow.workspace = true
chrono.workspace = true
clap = { version = "=4.6.7", features = ["derive", "env"] }
fabric = { path = "../fabric" }
fabric-collect = { path = "../fabric-collect" }
fabric-core = { path = "../fabric-core" }
fabric-graph = { path = "../fabric-graph" }
fabric-query = { path = "../fabric-query" }
fabric-store = { path = "../fabric-store" }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "=1.1.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
