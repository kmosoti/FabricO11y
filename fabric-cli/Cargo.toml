[package]
name = "fabric-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "fabric"
path = "src/main.rs"

[dependencies]
arrow = { version = "=59.2.0", default-features = false, features = ["ipc"] }
chrono = "=0.4.45"
clap = { version = "=4.6.7", features = ["derive", "env"] }
fabric-collect = { path = "../fabric-collect" }
fabric-core = { path = "../fabric-core" }
fabric-graph = { path = "../fabric-graph" }
fabric-query = { path = "../fabric-query" }
fabric-store = { path = "../fabric-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
