[package]
name = "fabric"
version = "0.1.1-alpha.1"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "=1.1.8"
hmac.workspace = true
rusqlite.workspace = true
schemars = { version = "1", optional = true }
admission-kernel = { path = "../admission-kernel" }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "admission"
harness = false

[features]
query-schema = ["dep:schemars"]

[dependencies.rustix]
version = "1"
features = ["net", "process", "fs", "event"]

[dependencies.sha2]
version = "0.10"
