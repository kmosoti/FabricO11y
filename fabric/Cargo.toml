[package]
name = "fabric"
version = "0.1.1-alpha.2"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
toml = "=1.1.8"
hmac.workspace = true
rusqlite.workspace = true
admission-kernel = { path = "../admission-kernel" }
fabric-query-contract = { path = "../fabric-query-contract" }
fabric-evidence = { path = "../fabric-evidence" }

[dev-dependencies]
fabric-ops = { path = "../fabric-ops" }
tempfile = "3"

[[bench]]
name = "admission"
harness = false

[features]
query-schema = ["fabric-query-contract/query-schema"]

[dependencies.rustix]
version = "1"
features = ["net", "process", "fs", "event"]

[dependencies.sha2]
version = "0.10"

[[bench]]
name = "query_dispatch_static"
harness = false

[[bench]]
name = "query_dispatch_enum"
harness = false

[[bench]]
name = "query_dispatch_dyn"
harness = false
