[package]
name = "fabric-observation"
version = "0.1.0"
edition = "2024"
description = "Adapter support: the version-one Observation record for logs, metric points and spans, and its canonical FOB1 block encoding"
publish = false

[dependencies]
crc32fast = "=1.5.2"

# `cargo kani` sets cfg(kani) to compile the proof harnesses in src/proofs.rs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
