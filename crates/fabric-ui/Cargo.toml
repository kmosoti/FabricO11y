[package]
name = "fabric-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded operator console models and Leptos browser composition root"

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.22", features = ["csr"] }
web-sys = { version = "=0.3.106", features = ["Window", "Location", "Document", "HtmlElement", "EventTarget", "Event", "Navigator"] }

[lints.rust]
unsafe_code = "forbid"
