[package]
name = "fabric-ui"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Bounded operator console models and Leptos browser composition root"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.22", features = ["csr"] }
web-sys = { version = "=0.3.106", features = ["Window", "Location", "Document", "HtmlElement", "EventTarget", "Event", "Navigator", "Request", "RequestInit", "RequestCredentials", "RequestCache", "Response", "Headers", "ReadableStream", "ReadableStreamDefaultReader", "Performance", "AbortController", "AbortSignal", "BroadcastChannel", "MessageEvent"] }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"

[lints.rust]
unsafe_code = "forbid"
