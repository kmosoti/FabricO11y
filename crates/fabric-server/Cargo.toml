[package]
name = "fabric-server"
version = "0.1.0"
edition = "2024"
description = "Fabric O11y central server: authenticated batch intake with durable ACK"

[dependencies]
fabric_o11y = { path = "../.." }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
axum-server = { version = "=0.7.3", features = ["tls-rustls-no-provider"] }
prost = "=0.14.4"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
