<svg xmlns="http://www.w3.org/2000/svg" width="560" height="372" viewBox="0 0 560 372" role="img" aria-labelledby="title description">
  <title id="title">FabricO11y on a single host</title>
  <desc id="description">Linux system metrics go to the local collector. Apps and agents send observations to Spindle, which stores them durably and passes them to the collector over a Unix socket. The fabric CLI reads the local projection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65dec4"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="558" height="370" rx="19" fill="#101c2d" stroke="#405875" stroke-width="2"/>
  <g fill="none" stroke="#65dec4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M 152 94 V 207"/>
    <path d="M 408 94 V 120"/>
    <path d="M 408 189 V 207"/>
    <path d="M 280 273 V 305"/>
  </g>
  <g fill="#1a2c45" stroke="#526b8a" stroke-width="1.5">
    <rect x="36" y="27" width="232" height="65" rx="12"/>
    <rect x="292" y="27" width="232" height="65" rx="12"/>
    <rect x="292" y="122" width="232" height="65" rx="12"/>
    <rect x="124" y="209" width="312" height="62" rx="12"/>
  </g>
  <rect x="174" y="307" width="212" height="38" rx="10" fill="#143d3a" stroke="#65dec4" stroke-width="1.5"/>
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#f4f8ff" font-size="21" font-weight="700">
      <text x="152" y="53">Linux host</text>
      <text x="408" y="53">Apps and agents</text>
      <text x="408" y="148">Spindle</text>
      <text x="280" y="234">Fabric collector</text>
      <text x="280" y="333" font-family="monospace" font-size="19">fabric query</text>
    </g>
    <g fill="#c4d6ec" font-size="17">
      <text x="152" y="76">System metrics</text>
      <text x="408" y="76">Observations</text>
      <text x="408" y="172">Durable local records</text>
      <text x="280" y="257">Local projection</text>
    </g>
  </g>
</svg>
