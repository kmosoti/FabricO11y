# Authoring scaffold only. It MUST be rejected by execution admission as-is.
# M01 specifies the accepted schema; M02 implements and independently verifies it.
# Replace every UNBOUND value, expand protected file inventories, bind all five
# stages and their commands, and register budgets before an implementation attempt.
schema_version = 1
kind = "mission_authoring_template"
execution_admitted = false

[mission]
id = "UNBOUND"
mission_type = "COMPOSITE_WIRE"
target_release = "v0.1.0-alpha.2"
state = "Backlog"
depends_on = []
max_assertion_failed_attempts = 3
max_infrastructure_retries = 1

[architecture]
semantic_effect_layer = "UNBOUND"
composition_depth = 1
component_id = "UNBOUND"
provided_ports = []
required_ports = []
accepted_policy_revision = "UNBOUND"
require_no_std = true
allow_alloc = false
forbid_unsafe = true
allow_dynamic_dispatch = false
approved_collections = []

[context]
objective = "UNBOUND"
initial_state = "UNBOUND"
base_commit = "UNBOUND"
base_tree = "UNBOUND"
contract_revision = "UNBOUND"
mutable_paths = []
# Globs must be expanded to a canonical finite inventory before admission.
# A protected artifact with a missing digest is a refusal, not an optional check.
protected_inventory_path = "UNBOUND"
protected_inventory_sha256 = "UNBOUND"
negative_control_inventory = "UNBOUND"
reference_implementation = "UNBOUND"

[isolation]
worktree_owner = "trusted_coordinator"
worktree_root = "UNBOUND"
write_lease = "UNBOUND"
trusted_oracle_root = "UNBOUND"
trusted_receipt_root = "UNBOUND"
