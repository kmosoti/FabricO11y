# The default distribution and typed client resolve without renderer dependencies.
[headless]
roots = ["fabric-cli", "fabric-client", "fabric-mcp", "fabric-server"]
renderer_families = ["leptos", "tauri", "wgpu"]

# Direct dependency boundaries, including test dependencies.
[crates]
admission-kernel = ["vstd"]
fabric = ["serde", "serde_json", "tempfile", "admission-kernel", "fabric-ops", "fabric-evidence", "rusqlite", "rustix", "sha2", "hmac", "schemars", "toml"]
fabric-corpus = ["sha2"]
fabric-ops = []
fabric-colloquium = []
fabric-evidence = ["serde", "serde_json", "sha2"]
fabric-core = ["admission-kernel", "arrow", "chrono", "fabric-evidence", "serde", "serde_json", "proptest"]
fabric-graph = ["arrow", "fabric-core", "serde", "serde_json", "proptest"]
fabric-store = ["admission-kernel", "arrow", "chrono", "fabric-core", "fabric-graph", "parking_lot", "parquet", "redb", "rustix", "serde", "serde_json", "tempfile"]
fabric-collect = ["admission-kernel", "chrono", "fabric", "fabric-core", "fabric-graph", "fabric-query", "fabric-server", "fabric-store", "parking_lot", "rustix", "serde", "serde_json", "tokio", "tempfile"]
fabric-query = ["fabric", "fabric-core", "fabric-graph", "fabric-store", "chrono", "datafusion", "arrow", "parquet", "tokio", "serde", "serde_json", "sha2", "hmac", "rustix", "tempfile"]
fabric-mcp = ["fabric", "rmcp", "schemars", "serde", "serde_json", "tokio", "futures", "tokio-util", "tempfile"]
fabric-server = ["fabric", "fabric-query", "serde", "serde_json", "rusqlite", "sha2", "chrono", "hmac", "reqwest", "rustix", "admission-kernel", "parking_lot", "tokio", "tempfile"]
fabric-cli = ["admission-kernel", "arrow", "chrono", "clap", "fabric", "fabric-collect", "fabric-core", "fabric-graph", "fabric-query", "fabric-store", "rustix", "serde", "serde_json", "sha2", "tokio", "toml"]
fabric-client = ["fabric", "serde", "serde_json", "tokio"]
xtask = ["serde", "serde_json", "tempfile", "toml", "proc-macro2", "arrow-array", "arrow-schema", "arrow-ipc", "fabric", "fabric-core", "fabric-server", "rusqlite", "rustix"]
