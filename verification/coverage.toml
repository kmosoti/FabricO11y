version = 1

[[invariants]]
id = "acknowledged-readback"
requirement = "Every acknowledged valid observation remains readable and export cannot stop at a valid record, including after restart."
required = true
boundaries = ["raw-wire admission", "durable custody", "reply encoding", "client decoding", "restart", "export progress"]
checks = ["depth-lifecycle", "normalization-lifecycle", "combined-lifecycle"]
proof_scope = "Executable lifecycle tests; slot/frontier proofs do not establish serialization or storage implementation correctness."
assumptions = ["Filesystem/device honors synchronization; process restart does not simulate power loss."]

[[invariants]]
id = "finite-cosine-stability"
requirement = "Defined cosine results remain stable under representable positive rescaling across extreme finite magnitudes."
required = true
boundaries = ["finite vector validation", "scaled arithmetic", "similarity result"]
checks = ["cosine-extremes"]
proof_scope = "Numerical metamorphic tests, not a real-arithmetic or exhaustive floating-point proof."
assumptions = ["Rescaling preserves finite nonzero input components and the test tolerance accounts for floating-point rounding."]

[[checks]]
id = "depth-lifecycle"
package = "fabric"
target = "readback_lifecycle"
test = "accepted_depth_boundary_survives_lifecycle"

[[checks]]
id = "normalization-lifecycle"
package = "fabric"
target = "readback_lifecycle"
test = "compact_numbers_survive_lifecycle"

[[checks]]
id = "combined-lifecycle"
package = "fabric"
target = "readback_lifecycle"
test = "combined_boundaries_survive_lifecycle"

[[checks]]
id = "cosine-extremes"
package = "fabric"
target = "readback_lifecycle"
test = "cosine_positive_rescaling_extremes"

[[invariants]]
id = "canonical-custody"
requirement = "Canonical batches preserve original bytes and reject conflicting identities atomically; acknowledged payloads survive reopen and remain retriable at quota."
required = true
boundaries = ["versioned raw wire", "atomic admission", "durable prefix", "quota", "restart"]
checks = ["canonical-bytes", "canonical-quota", "sdk-canonical-handoff", "baseline-continuous-read", "maximum-batch-retry"]
proof_scope = "Golden-byte, quota and real SDK/daemon/receiver lifecycle tests. Custody Lean and executable Verus predicates have separate abstract scopes."
assumptions = ["Filesystem and device honor synchronization; SHA256 collision resistance for retained point-read digests. Process tests do not simulate physical power loss."]

[[invariants]]
id = "authorized-investigation"
requirement = "Queries authorize source scope before aggregation, preserve fixed source snapshots and exact wide statistics, and reject incomplete aggregate scans."
required = true
boundaries = ["authenticated receiver", "scope predicate", "projection", "aggregation", "pagination", "budget"]
checks = ["canonical-scope", "wide-query", "snapshot-query", "query-budget", "query-authority", "projection-failure"]
proof_scope = "Independent mixed-record oracle and adapter regression tests; no whole database implementation proof. Native Greptime fault/restart and million-record measurements require separately configured trials."
assumptions = ["Parquet/DataFusion implement their documented typed arithmetic and file semantics; exact tested unsigned extremes are retained."]

[[invariants]]
id = "bounded-agent-transport"
requirement = "Agent stdio rejects oversized incomplete input and cancellation retains active capacity until the actual canonical exchange finishes."
required = true
boundaries = ["stdio codec", "typed tool dispatch", "canonical cancellation", "worker cleanup"]
checks = ["mcp-ingress", "mcp-cancellation", "global-context"]
proof_scope = "Real child-process MCP tests and cross-process SDK context test; arbitrary LLM behavior is outside scope."
assumptions = ["The OS enforces process and cgroup limits; observed content is data rather than tool authority."]

[[invariants]]
id = "descriptor-failure-isolation"
requirement = "Analytical file operations remain bounded as segments grow; temporary descriptor exhaustion preserves the receiver and permits authenticated progress, admission and byte-exact replay after recovery."
required = true
boundaries = ["eager file listing", "native file limit", "listener pressure", "recovery", "canonical replay"]
checks = ["bounded-file-query", "descriptor-recovery"]
proof_scope = "Native isolated-process descriptor-pressure regressions, not a proof of every resource failure or third-party query implementation."
assumptions = ["The OS enforces per-process descriptor limits and temporary pressure eventually releases."]

