package "ocaml-compiler" {
  opam-version: "2.0"
  version: "5.3.0"
  synopsis: "Official release of OCaml 5.3.0"
  maintainer: [
    "David Allsopp <dra27@dra27.uk>"
    "Florian Angeletti <florian.angeletti@inria.fr>"
  ]
  authors: [
    "Xavier Leroy"
    "Damien Doligez"
    "Alain Frisch"
    "Jacques Garrigue"
    "Didier Rémy"
    "KC Sivaramakrishnan"
    "Jérôme Vouillon"
  ]
  license: "LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception"
  homepage: "https://ocaml.org"
  bug-reports: "https://github.com/ocaml/opam-repository/issues"
  depends: [
    "ocaml" {= "5.3.0" & post}
    "base-unix" {post}
    "base-bigarray" {post}
    "base-threads" {post}
    "base-domains" {post}
    "base-nnp" {post}
    "base-effects" {post}
    (("arch-x86_64" {os = "win32" & arch = "x86_64"} &
      ("system-mingw" |
       ("system-msvc" & "winpthreads" &
        "ocaml-option-no-compression" {os = "win32"}))) |
     ("arch-x86_32" {os = "win32"} &
      "ocaml-option-bytecode-only" {os = "win32"} &
      ("system-mingw" |
       ("system-msvc" & "winpthreads" &
        "ocaml-option-no-compression" {os = "win32"}))) |
     "base-unix" {os != "win32" & post})
    "ocaml-option-bytecode-only"
      {arch != "arm64" & arch != "x86_64" & arch != "s390x" &
       arch != "riscv64" &
       arch != "ppc64"}
    "flexdll" {>= "0.42" & os = "win32"}
  ]
  depopts: [
    "ocaml-option-32bit"
    "ocaml-option-afl"
    "ocaml-option-bytecode-only"
    "ocaml-option-no-flat-float-array"
    "ocaml-option-flambda"
    "ocaml-option-fp"
    "ocaml-option-no-compression"
    "ocaml-option-musl"
    "ocaml-option-leak-sanitizer"
    "ocaml-option-address-sanitizer"
    "ocaml-option-static"
    "ocaml-option-tsan"
  ]
  conflicts: ["relocatable"]
  setenv: CAML_LD_LIBRARY_PATH = "%{lib}%/stublibs"
  build: [
    [
      "./configure"
      "--host=x86_64-pc-windows"
        {system-msvc:installed & arch-x86_64:installed}
      "--host=x86_64-w64-mingw32"
        {os-distribution = "cygwin" & system-mingw:installed &
         arch-x86_64:installed}
      "--host=i686-pc-windows"
        {system-msvc:installed & arch-x86_32:installed}
      "--host=i686-w64-mingw32"
        {os-distribution = "cygwin" & system-mingw:installed &
         arch-x86_32:installed}
      "--prefix=%{prefix}%"
      "--docdir=%{doc}%/ocaml"
      "--with-flexdll=%{flexdll:share}%" {os = "win32" & flexdll:installed}
      "--with-winpthreads-msvc=%{winpthreads:share}%" {system-msvc:installed}
      "-C"
      "--with-afl" {ocaml-option-afl:installed}
      "--disable-native-compiler" {ocaml-option-bytecode-only:installed}
      "--disable-flat-float-array"
        {ocaml-option-no-flat-float-array:installed}
      "--enable-flambda" {ocaml-option-flambda:installed}
      "--enable-frame-pointers" {ocaml-option-fp:installed}
      "--without-zstd" {ocaml-option-no-compression:installed}
      "--enable-tsan" {ocaml-option-tsan:installed}
      "CC=cc"
        {!ocaml-option-32bit:installed & !ocaml-option-musl:installed &
         (os = "openbsd" | os = "macos")}
      "CC=clang" {ocaml-option-tsan:installed & os = "macos"}
      "CC=musl-gcc"
        {ocaml-option-musl:installed & os-distribution != "alpine"}
      "CFLAGS=-Os" {ocaml-option-musl:installed & arch != "arm64"}
      "CFLAGS=-Os -mno-outline-atomics"
        {ocaml-option-musl:installed & arch = "arm64"}
      "LDFLAGS=-Wl,--no-as-needed,-ldl"
        {ocaml-option-leak-sanitizer:installed |
         ocaml-option-address-sanitizer:installed & os != "macos"}
      "CC=gcc -ldl -fsanitize=leak -fno-omit-frame-pointer -O1 -g"
        {ocaml-option-leak-sanitizer:installed}
      "CC=gcc -ldl -fsanitize=address -fno-omit-frame-pointer -O1 -g"
        {ocaml-option-address-sanitizer:installed & os != "macos"}
      "CC=clang -fsanitize=address -fno-omit-frame-pointer -O1 -g"
        {ocaml-option-address-sanitizer:installed & os = "macos"}
      "CC=gcc -m32" {ocaml-option-32bit:installed & os = "linux"}
      "CC=gcc -Wl,-read_only_relocs,suppress -arch i386 -m32"
        {ocaml-option-32bit:installed & os = "macos"}
      "ASPP=musl-gcc -c"
        {ocaml-option-musl:installed & os-distribution != "alpine"}
      "--host=i386-linux" {ocaml-option-32bit:installed & os = "linux"}
      "--host=i386-apple-darwin13.2.0"
        {ocaml-option-32bit:installed & os = "macos"}
      "LIBS=-static" {ocaml-option-static:installed}
      "--disable-warn-error"
    ]
    [make "-j%{jobs}%"]
  ]
  install: [make "install"]
  build-env: [
    [MSYS2_ARG_CONV_EXCL = "*"]
    [LSAN_OPTIONS = "detect_leaks=0,exitcode=0"]
    [ASAN_OPTIONS = "detect_leaks=0,exitcode=0"]
  ]
  dev-repo: "git+https://github.com/ocaml/ocaml.git#5.3"
  url {
    src:
      "https://github.com/ocaml/ocaml/releases/download/5.3.0/ocaml-5.3.0.tar.gz"
    checksum:
      "sha256=22c1dd9de21bf43b62d1909041fb5fad648905227bf69550a6a6bef31e654f38"
  }
  extra-source "ocaml-compiler.install" {
    src:
      "https://raw.githubusercontent.com/ocaml/ocaml/899b8f3bece45f55161dad72eaa223c2bb7202e8/ocaml-variants.install"
    checksum: [
      "sha256=7af3dc34e6f9f3be2ffd8d32cd64fa650d6a036c86c4821a7033d24a90fba11c"
      "md5=781ea69255fd0cb643a9617ff56fd6ba"
    ]
  }
  x-env-path-rewrite: [
    [CAML_LD_LIBRARY_PATH (";" {os = "win32"} ":" {os != "win32"}) "target"]
  ]
  x-revision: "3"
}
