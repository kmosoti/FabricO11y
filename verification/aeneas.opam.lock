package "conf-gmp" {
  opam-version: "2.0"
  version: "5"
  synopsis: "Virtual package relying on a GMP lib system installation"
  description:
    "This package can only install if the GMP lib is installed on the system."
  maintainer: "nbraud"
  authors: "nbraud"
  license: "GPL-1.0-or-later"
  homepage: "http://gmplib.org/"
  bug-reports: "https://github.com/ocaml/opam-repository/issues"
  depends: [
    "conf-pkg-config" {os = "macos"}
    (("host-arch-x86_32" {os = "win32" & os-distribution != "cygwinports"} &
      "conf-mingw-w64-gmp-i686"
        {os = "win32" & os-distribution != "cygwinports"}) |
     ("host-arch-x86_64" {os = "win32" & os-distribution != "cygwinports"} &
      "conf-mingw-w64-gmp-x86_64"
        {os = "win32" & os-distribution != "cygwinports"}))
  ]
  flags: conf
  build: [
    [
      "sh"
      "-c"
      "pkg-config --print-errors --exists gmp || cc -c $CFLAGS -I/usr/local/include test.c"
    ] {os != "win32"}
    [
      "sh"
      "-exc"
      "$(ocamlc -config-var c_compiler) -c $CFLAGS -I/usr/local/include test.c"
    ] {os = "win32" & os-distribution = "cygwinports"}
    [
      "sh"
      "-exc"
      "%{host-arch-x86_64:installed?x86_64:}%%{host-arch-x86_32:installed?i686:}%-w64-mingw32-gcc -c $CFLAGS test.c"
    ] {os = "win32" & os-distribution != "cygwinports"}
  ]
  depexts: [
    ["libgmp-dev"] {os-family = "debian"}
    ["libgmp-dev"] {os-family = "ubuntu"}
    ["gmp"] {os = "macos" & os-distribution = "homebrew"}
    ["gmp"] {os-distribution = "macports" & os = "macos"}
    ["gmp" "gmp-devel"] {os-distribution = "centos"}
    ["gmp" "gmp-devel"] {os-family = "fedora" | os-family = "fedora"}
    ["gmp" "gmp-devel"] {os-distribution = "ol"}
    ["gmp"] {os = "openbsd"}
    ["gmp"] {os = "freebsd"}
    ["gmp"] {os-distribution = "arch"}
    ["gmp-dev"] {os-distribution = "alpine"}
    ["gmp-devel"] {os-family = "suse" | os-family = "opensuse"}
    ["gmp"] {os = "win32" & os-distribution = "cygwinports"}
    ["gmp"] {os-distribution = "nixos"}
    ["libgmp-devel"] {os-family = "altlinux"}
  ]
  extra-source "test.c" {
    src:
      "https://raw.githubusercontent.com/ocaml/opam-source-archives/main/patches/conf-gmp/test.c.4"
    checksum: [
      "sha256=54a30735f1f271a2531526747e75716f4490dd7bc1546efd6498ccfe3cc4d6fb"
      "md5=2fd2970c293c36222a6d299ec155823f"
    ]
  }
}
package "conf-pkg-config" {
  opam-version: "2.0"
  version: "5"
  synopsis:
    "Check if pkg-config is installed and create an opam switch local pkgconfig folder"
  description: """\
This package can only install if the pkg-config package is installed
on the system."""
  maintainer: "David Allsopp <dra27@dra27.uk>"
  authors: [
    "James Henstridge" "Tim Janik" "Havoc Pennington" "Scott Remnant"
  ]
  license: "GPL-2.0-or-later"
  homepage: "http://www.freedesktop.org/wiki/Software/pkg-config/"
  bug-reports: "https://github.com/ocaml/opam-repository/issues"
  depends: [
    ("host-arch-x86_64"
       {os = "win32" &
        (os-distribution = "cygwin" | os-distribution = "msys2")} &
     "conf-mingw-w64-gcc-x86_64"
       {os = "win32" &
        (os-distribution = "cygwin" | os-distribution = "msys2")} &
     "conf-mingw-w64-pkgconf-x86_64"
       {os = "win32" & os-distribution = "msys2"} |
     "host-arch-x86_32"
       {os = "win32" &
        (os-distribution = "cygwin" | os-distribution = "msys2")} &
     "conf-mingw-w64-gcc-i686"
       {os = "win32" &
        (os-distribution = "cygwin" | os-distribution = "msys2")} &
     "conf-mingw-w64-pkgconf-i686" {os = "win32" & os-distribution = "msys2"})
  ]
  conflicts: [
    "mingw-w64-shims" {< "1.0.0"}
  ]
  build: [
    ["pkg-config" "--help"]
      {os != "win32" & !(os = "macos" & os-distribution = "homebrew")}
    ["pkgconf" "--version"]
      {os = "win32" & os-distribution != "msys2" |
       os = "macos" & os-distribution = "homebrew"}
    [
      "sh"
      "./write-config.sh"
      name
      "-v"
      "command:list"
      "EOL"
      "pkg-config"
        {os != "win32" & !(os = "macos" & os-distribution = "homebrew")}
      "pkgconf"
        {os = "win32" & os-distribution != "msys2" |
         os = "macos" & os-distribution = "homebrew"}
      "i686-w64-mingw32-pkgconf"
        {os = "win32" & os-distribution = "msys2" &
         host-arch-x86_32:installed}
      "--personality=i686-w64-mingw32"
        {os = "win32" & os-distribution = "cygwin" &
         host-arch-x86_32:installed}
      "x86_64-w64-mingw32-pkgconf"
        {os = "win32" & os-distribution = "msys2" &
         host-arch-x86_64:installed}
      "--personality=x86_64-w64-mingw32"
        {os = "win32" & os-distribution = "cygwin" &
         host-arch-x86_64:installed}
      "EOL"
    ]
    ["sh" "./install-shim.sh" name "pkgconf" bin]
      {os = "win32" & os-distribution = "cygwin"}
  ]
  depexts: [
    ["pkg-config"] {os-family = "debian" | os-family = "ubuntu"}
    ["pkgconf"] {os-distribution = "arch"}
    ["pkgconf-pkg-config"] {os-family = "fedora"}
    ["pkgconfig"] {os-distribution = "centos" & os-version <= "7"}
    ["pkgconf-pkg-config"] {os-distribution = "mageia"}
    ["pkgconfig"] {os-distribution = "rhel" & os-version <= "7"}
    ["pkgconfig"] {os-distribution = "ol" & os-version <= "7"}
    ["pkgconf"] {os-distribution = "alpine"}
    ["pkg-config"] {os-distribution = "nixos"}
    ["pkgconf"] {os = "macos" & os-distribution = "homebrew"}
    ["pkgconfig"] {os = "macos" & os-distribution = "macports"}
    ["pkgconf"] {os = "freebsd"}
    ["pkgconf-pkg-config"] {os-distribution = "rhel" & os-version >= "8"}
    ["pkgconf-pkg-config"] {os-distribution = "centos" & os-version >= "8"}
    ["pkgconf-pkg-config"] {os-distribution = "ol" & os-version >= "8"}
    ["system:pkgconf"] {os = "win32" & os-distribution = "cygwinports"}
    ["pkgconf"] {os-distribution = "cygwin"}
  ]
  dev-repo: "git+https://github.com/dra27/mingw-w64-shims.git"
  extra-source "install-shim.sh" {
    src:
      "https://raw.githubusercontent.com/dra27/mingw-w64-shims/refs/tags/1.0.1/install-shim.sh"
    checksum: [
      "sha256=9f99322c38b0889f5b1dafbb35ab31dc012ae98c4f98b0f740a89f943142d961"
      "sha512=0b76a529454b00027b5768fa6ead1b8dda6bc3adab55f4288a702f4cc5d7b280be938cced6841b1556e8cf98f56ecc95b7b22006859d7a91f0ef852aea74e88c"
    ]
  }
  extra-source "write-config.sh" {
